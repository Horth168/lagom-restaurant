# Render's free plan puts the server to sleep after 15 minutes without visits. While asleep,
# ABA payment messages are not read. Two pings keep LAGOM awake 24/7 (same idea as IceQ Sole):
#   1. Supabase pg_cron job "lagom-keep-awake" every 5 minutes (main ping)
#   2. this GitHub Action every 10 minutes (backup)
# LAGOM has its own Render workspace, so its 750 free hours/month are not shared with other projects.
# GitHub pauses scheduled jobs after 60 days without commits; re-enable it under Actions if that happens.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping health check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://lagom-api.onrender.com/api/health) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not answer with 200"; exit 1
