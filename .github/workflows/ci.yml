# Automatic checks on every push and pull request.
# Backend tests run twice: on SQLite (like your computer) and on PostgreSQL (like the live server).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lagom
          POSTGRES_PASSWORD: lagom-ci-only
          POSTGRES_DB: lagom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lagom" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql://lagom:lagom-ci-only@localhost:5432/lagom_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests scripts

      - name: Tests (SQLite)
        run: pytest -q

      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}

      - name: Migrations on PostgreSQL (up, check, down, up)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python -c "from sqlalchemy import create_engine, text; e=create_engine('${{ env.PG_URL }}'.replace('postgresql://','postgresql+psycopg://')); c=e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Demo data loads on PostgreSQL
        env:
          DATABASE_URL: ${{ env.PG_URL }}
          DEMO_STAFF_PASSWORD: ci-demo-password-only
        run: python -m scripts.seed_demo

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
